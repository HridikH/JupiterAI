<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datasheet Glasses — Console</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c232c; --line:#2a3340;
    --fg:#e6edf3; --dim:#8b96a5; --accent:#4493f8;
    --ok:#2ea043; --okbg:#0f2417; --warn:#d29922; --warnbg:#2a230c;
    --err:#f85149; --errbg:#2a1113; --cand:#a371f7; --candbg:#1e1630;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
       background:var(--bg);color:var(--fg)}
  header{display:flex;align-items:center;gap:14px;padding:12px 18px;
         border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.3px}
  header .sub{color:var(--dim);font-size:12px}
  .spacer{flex:1}
  .chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);
        color:var(--dim);display:inline-flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
  .chip.live .dot{background:var(--ok)} .chip.live{color:var(--ok);border-color:#1f3b27}
  .chip.off .dot{background:var(--err)} .chip.off{color:var(--err);border-color:#3b1f22}
  .batt .bar{width:46px;height:8px;border:1px solid var(--line);border-radius:3px;overflow:hidden}
  .batt .fill{height:100%;background:var(--ok)}
  main{max-width:1000px;margin:0 auto;padding:22px 18px 80px}
  .stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;
         padding:22px;min-height:320px}
  .badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.8px;
         text-transform:uppercase;padding:5px 12px;border-radius:8px;margin-bottom:14px}
  .accepted .badge{background:var(--okbg);color:var(--ok);border:1px solid #1f3b27}
  .candidate_selection .badge{background:var(--candbg);color:var(--cand);border:1px solid #30224d}
  .recapture .badge{background:var(--warnbg);color:var(--warn);border:1px solid #3b3111}
  .error .badge{background:var(--errbg);color:var(--err);border:1px solid #3b1f22}
  .partno{font-size:34px;font-weight:700;letter-spacing:.5px;margin:2px 0 2px}
  .meta{color:var(--dim);font-size:14px;margin-bottom:16px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .imgs{display:flex;gap:12px;flex-wrap:wrap}
  .imgs figure{margin:0} .imgs img{max-width:220px;max-height:180px;border:1px solid var(--line);
       border-radius:8px;background:#000} .imgs figcaption{color:var(--dim);font-size:11px;margin-top:4px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
  .kv .k{color:var(--dim)}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 15px;
       font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
  .btn:hover{filter:brightness(1.08)} .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
  .cards{display:flex;flex-direction:column;gap:12px;margin-top:6px}
  .card{display:flex;align-items:center;gap:16px;background:var(--panel2);
        border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .card.chosen{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset}
  .card .num{font-size:20px;font-weight:700} .card .sub{color:var(--dim);font-size:13px}
  .card .score{margin-left:auto;text-align:right;color:var(--dim);font-size:13px}
  .big-msg{font-size:22px;font-weight:600;margin:6px 0}
  .hint{color:var(--dim)}
  .ocr{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#0b0f14;
       border:1px solid var(--line);border-radius:8px;padding:10px;color:#b9c6d3;
       white-space:pre-wrap;word-break:break-word;font-size:13px;max-height:120px;overflow:auto}
  footer{position:fixed;bottom:0;left:0;right:0;background:var(--panel);
         border-top:1px solid var(--line);padding:8px 18px;display:flex;
         align-items:center;gap:16px;font-size:12px;color:var(--dim)}
  .debug{display:none;max-width:1000px;margin:12px auto 0;background:var(--panel);
         border:1px solid var(--line);border-radius:12px;padding:14px 18px;font-size:12.5px}
  .debug.open{display:block}
  .debug table{border-collapse:collapse;width:100%} .debug td{padding:3px 10px 3px 0}
  .debug .k{color:var(--dim)} code{color:#9db4c9}
  label.sw{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>Datasheet Glasses <span class="sub">— laptop console</span></h1>
  <div class="spacer"></div>
  <span id="conn" class="chip off"><span class="dot"></span><span id="conntxt">connecting…</span></span>
  <span class="chip batt" title="device battery"><span>🔋</span>
     <span class="bar"><span id="battfill" class="fill" style="width:0%"></span></span>
     <span id="battmv">— V</span></span>
</header>

<main>
  <div id="stage" class="stage">
    <div class="big-msg">Ready</div>
    <div class="hint">Waiting for a capture from the glasses… press the button on the device.</div>
  </div>
</main>

<div id="debug" class="debug">
  <strong>Debug</strong>
  <table id="dbgtable"></table>
</div>

<footer>
  <label class="sw"><input type="checkbox" id="ttschk"> speak result (off by default)</label>
  <label class="sw"><input type="checkbox" id="dbgchk"> debug panel</label>
  <div class="spacer" style="flex:1"></div>
  <span id="cfgline"></span>
</footer>

<script>
const $ = s => document.querySelector(s);
let ws, latestId = null, decisionStart = {}, chosen = {};

// ---- connection ----
function connect(){
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => setConn(true);
  ws.onclose = () => { setConn(false); setTimeout(connect, 1200); };
  ws.onerror = () => ws.close();
  ws.onmessage = ev => {
    let m; try{ m = JSON.parse(ev.data); }catch{ return; }
    if(m.type === "state" || m.type === "result"){
      if(m.request_id){ latestId = m.request_id; refresh(m.request_id); }
    }
  };
}
function setConn(up){
  const c = $("#conn");
  c.className = "chip " + (up ? "live" : "off");
  $("#conntxt").textContent = up ? "live" : "offline";
}

// ---- fetch canonical record + render ----
async function refresh(id){
  try{
    const r = await fetch(`/result/${id}`);
    if(!r.ok) return;
    render(await r.json());
  }catch{}
}

function render(rec){
  updateBattery(rec.battery_mv);
  updateDebug(rec);
  const s = rec.status, res = rec.result || {};
  const stage = $("#stage");
  stage.className = "stage " + s;
  if(s === "accepted")                 stage.innerHTML = viewAccepted(rec, res);
  else if(s === "candidate_selection") stage.innerHTML = viewCandidates(rec, res);
  else if(s === "recapture")           stage.innerHTML = viewRecapture(res);
  else if(s === "error")               stage.innerHTML = viewError(res);
  else if(s === "processing")          stage.innerHTML = `<div class="big-msg">Processing…</div>
                                         <div class="hint">Reading the marking and matching the catalog.</div>`;
  else                                 stage.innerHTML = `<div class="big-msg">Received</div>`;
  wireCandidatePicks(rec);
  maybeSpeak(rec);
}

function esc(x){ return String(x==null?"":x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function dsLink(ds, label){
  if(!ds || !ds.path) return `<span class="hint">no datasheet</span>`;
  const page = ds.cite_page || 1;
  return `<a class="btn" target="_blank" href="/pdf?path=${encodeURIComponent(ds.path)}#page=${page}">${label||"Open datasheet"} (p.${page})</a>`;
}

function viewAccepted(rec, res){
  const id = rec.request_id;
  return `
    <span class="badge">Accepted</span>
    <div class="partno">${esc(res.part_number)}</div>
    <div class="meta">${esc(res.manufacturer)} · ${esc(res.package)}</div>
    <div class="grid">
      <div>
        <div class="kv">
          <div class="k">Score</div><div>${(res.score??0).toFixed(3)}</div>
          <div class="k">Margin</div><div>${(res.margin??0).toFixed(3)}</div>
          <div class="k">Matched</div><div><code>${esc(res.matched_string)}</code></div>
        </div>
        <p style="margin-top:14px">${dsLink(res.datasheet)}</p>
      </div>
      <div>
        <div class="imgs">
          <figure><img src="/media/${id}" onerror="this.style.display='none'"><figcaption>original</figcaption></figure>
          <figure><img src="/media/${id}/crop" onerror="this.style.display='none'"><figcaption>crop</figcaption></figure>
        </div>
        <div style="margin-top:10px" class="k hint">OCR</div>
        <div class="ocr">${esc(res.ocr_text) || "(none)"}</div>
      </div>
    </div>`;
}

function viewCandidates(rec, res){
  const id = rec.request_id;
  if(decisionStart[id]===undefined) decisionStart[id] = performance.now();
  const cards = (res.candidates||[]).map((c,i)=>{
    const isChosen = chosen[id]===i;
    return `<div class="card ${isChosen?'chosen':''}" data-i="${i}">
      <div><div class="num">${esc(c.part_number)}</div>
           <div class="sub">${esc(c.manufacturer)} · ${esc(c.package)}</div></div>
      <div class="score">score ${(c.score??0).toFixed(3)}</div>
      ${dsLink(c.datasheet,"Datasheet")}
      <button class="btn pick" data-i="${i}" ${isChosen?'disabled':''}>${isChosen?'✓ selected':'This one'}</button>
    </div>`;
  }).join("");
  const note = chosen[id]!==undefined ? `<div class="hint" style="margin-top:12px">Operator selected
       <b>${esc((res.candidates[chosen[id]]||{}).part_number)}</b>. Decision logged separately.</div>` :
       `<div class="hint" style="margin-top:12px">Several parts are plausible — pick the correct one.
        Nothing is accepted until you choose.</div>`;
  return `<span class="badge">Choose a candidate</span>
          <div class="big-msg">${(res.candidates||[]).length} plausible matches</div>
          <div class="cards">${cards}</div>${note}`;
}

function wireCandidatePicks(rec){
  const id = rec.request_id;
  document.querySelectorAll(".pick").forEach(btn=>{
    btn.onclick = ()=>{
      const i = +btn.dataset.i;
      const ms = performance.now() - (decisionStart[id]||performance.now());
      chosen[id] = i;
      try{ ws.send(JSON.stringify({type:"user_decision", request_id:id, ms:Math.round(ms)})); }catch{}
      render(rec);  // re-render to show chosen state (client-side; server stays candidate)
    };
  });
}

function viewRecapture(res){
  const icons = {blur:"🌫",glare:"✨",off_center:"🎯",too_far:"🔭",unreadable:"❓"};
  return `<span class="badge">Recapture</span>
    <div class="big-msg">${icons[res.reason]||"↺"} ${esc((res.reason||"").replace("_"," "))}</div>
    <div class="hint" style="font-size:16px">${esc(res.message)}</div>`;
}
function viewError(res){
  return `<span class="badge">Error</span>
    <div class="big-msg">${esc(res.code)}</div>
    <div class="hint">${esc(res.message)}</div>`;
}

// ---- battery / debug / tts ----
function updateBattery(mv){
  if(!mv){ return; }
  const v = mv/1000;
  $("#battmv").textContent = v.toFixed(2)+" V";
  // rough li-ion gauge 3.3–4.2 V
  const pct = Math.max(0, Math.min(100, (v-3.3)/(4.2-3.3)*100));
  const fill = $("#battfill"); fill.style.width = pct+"%";
  fill.style.background = pct<20 ? "var(--err)" : pct<45 ? "var(--warn)" : "var(--ok)";
}
function updateDebug(rec){
  $("#cfgline").textContent = rec.config_version ? `${rec.config_version} · ${(rec.config_hash||"").slice(0,19)}…` : "";
  const t = rec.timestamps||{};
  const rows = Object.keys(t).map(k=>`<tr><td class="k">${k}</td><td>${(t[k]*1000).toFixed(1)} ms</td></tr>`).join("");
  const dec = rec.user_decision_ms!=null ? `<tr><td class="k">user decision</td><td>${rec.user_decision_ms.toFixed(0)} ms (excluded from latency)</td></tr>` : "";
  $("#dbgtable").innerHTML =
    `<tr><td class="k">request_id</td><td><code>${esc(rec.request_id)}</code></td></tr>
     <tr><td class="k">status</td><td>${esc(rec.status)}</td></tr>
     <tr><td class="k">config</td><td><code>${esc(rec.config_version)}</code></td></tr>
     <tr><td class="k">hash</td><td><code>${esc(rec.config_hash)}</code></td></tr>
     ${rows}${dec}`;
}
const spoken = {};
async function maybeSpeak(rec){
  if(!$("#ttschk").checked) return;
  const terminal = ["accepted","candidate_selection","recapture","error"];
  if(!terminal.includes(rec.status)) return;
  if(spoken[rec.request_id]===rec.status) return;
  spoken[rec.request_id] = rec.status;
  let text = "";
  const r = rec.result||{};
  if(rec.status==="accepted") text = `Accepted. ${r.part_number}.`;
  else if(rec.status==="candidate_selection") text = `${(r.candidates||[]).length} possible matches. Please choose.`;
  else if(rec.status==="recapture") text = r.message||"Please recapture.";
  else text = "Error.";
  try{ await fetch("/speak",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})}); }catch{}
}

$("#dbgchk").onchange = e => $("#debug").classList.toggle("open", e.target.checked);

connect();
</script>
</body>
</html>
