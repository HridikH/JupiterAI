# JSON Schema (draft 2020-12) for ONE parts.yaml entry.
$schema: "https://json-schema.org/draft/2020-12/schema"
title: Part
type: object
additionalProperties: false
required: [part_number, manufacturer, package, top_markings]
properties:
  part_number:
    type: string
    minLength: 1
  manufacturer:
    type: string
    minLength: 1
  package:
    type: string
    minLength: 1
  top_markings:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
  aliases:
    type: array
    items:
      type: string
  min_char_height_mm:
    type: number
    exclusiveMinimum: 0
  auto:
    type: boolean   # true = auto-cached from a web datasheet lookup (unreviewed)
