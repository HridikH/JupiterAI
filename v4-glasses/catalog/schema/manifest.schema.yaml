# JSON Schema (draft 2020-12) for ONE manifest.yaml entry.
$schema: "https://json-schema.org/draft/2020-12/schema"
title: ManifestEntry
type: object
additionalProperties: false
required: [orderable_number, manufacturer, package, url, retrieval_date, sha256, cache_path, reviewed]
properties:
  orderable_number:
    type: string
    minLength: 1
  manufacturer:
    type: string
    minLength: 1
  package:
    type: string
    minLength: 1
  url:
    type: string
    format: uri
  retrieval_date:
    type: string
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
  sha256:
    type: string
    pattern: "^[a-f0-9]{64}$"
  cache_path:
    type: string
    minLength: 1
  reviewed:
    type: boolean
  cite_page:
    type: integer
    minimum: 1
  family:
    type: string
